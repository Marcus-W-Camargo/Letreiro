name: Preencher dados em inglês

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preencher-dados-ingles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Instalar dependências da migração
        run: npm install --no-save @supabase/supabase-js axios

      - name: Preencher dados em inglês dos filmes existentes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/preencherTitulosIngles.js
