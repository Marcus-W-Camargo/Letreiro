name: Automação Diária Letreiro

on:
  schedule:
    # GitHub Actions agenda em UTC. Em São Paulo (UTC-3), roda às 00:07, 00:17,
    # 00:27, 00:37 e 00:47, com uma tentativa extra de segurança às 01:05.
    - cron: '7,17,27,37,47 3 * * *'
    - cron: '5 4 * * *'
  workflow_dispatch:

jobs:
  sortear-filme-job:
    runs-on: ubuntu-latest
    steps:
      - name: Baixando repositório do Git
        uses: actions/checkout@v4

      - name: Instalando o Ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalando Dependências do Banco
        run: npm install @supabase/supabase-js axios

      - name: Executando Script de Sorteio do TMDB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/sortearFilme.js
